# Workflow evals — the live harness (CLAUDE.md + skills + subagents loaded from disk): routing
# reads, subagent dispatch, skill activation and a with/without-CLAUDE.md contrast.
#
# Runs when CLAUDE.md, an agent definition, the workflow cases or the eval engine change
# (scripts/ci-detect.mjs). Tool tier, so the model goes through the bundled LiteLLM proxy.
# Activation cases are behaviour-shaped and only indicative on non-Anthropic models
# (evals/README.md), so this job reports but does not block. Needs the OPENROUTER_API_KEY secret.
name: eval-workflow

on:
  push:
    paths:
      - 'CLAUDE.md'
      - '.claude/agents/**'
      - 'evals/workflow/**'
      - 'evals/src/**'
      - '.github/workflows/eval-workflow.yml'
  pull_request:
    paths:
      - 'CLAUDE.md'
      - '.claude/agents/**'
      - 'evals/workflow/**'
      - 'evals/src/**'
      - '.github/workflows/eval-workflow.yml'

permissions:
  contents: read

concurrency:
  group: eval-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      agents: ${{ steps.detect.outputs.agents }}
      run_workflow: ${{ steps.detect.outputs.run_workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        working-directory: evals
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          BASE="${PR_BASE:-$PUSH_BEFORE}"
          # A new branch pushes with before=000…0; fall back to the root commit (everything changed).
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          CHANGED_FILES="$(git diff --name-only "$BASE...HEAD")"
          export CHANGED_FILES
          node scripts/ci-detect.mjs

  workflow:
    needs: changes
    if: needs.changes.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_BACKEND: openrouter
      OPENROUTER_BASE_URL: http://localhost:4000
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: anthropic/claude-haiku-4.5
      EVAL_JUDGE_MODEL: anthropic/claude-haiku-4.5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - run: pnpm exec vitest run workflow --no-file-parallelism
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
