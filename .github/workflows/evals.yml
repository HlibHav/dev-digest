# Harness evals — one workflow, three tiers, picked by evals/scripts/ci-detect.mjs:
#
#   skills    .claude/skills/<name>/** or evals/skills/<name>/** → evals/skills/<name> (content tier,
#             OpenRouter direct)
#   agents    .claude/agents/<name>.md or evals/agents/<name>/** → evals/agents/<name> (tool tier,
#             LiteLLM proxy; server/ and reviewer-core/ installed for lint:boundaries)
#   workflow  anything the live harness reads: CLAUDE.md / AGENTS.md (root or a package's),
#             TESTING.md, .claude/rules/**, any agent, a skill the workflow cases name, the
#             workflow cases or the eval engine (tool tier, LiteLLM proxy)
#
# A changed skill or agent without evals is a ::warning:: annotation, not a failure.
# Blocking: setup, typecheck, eval:quality and the unit tests (quality job), a provider outage (an
# exhausted or rejected key; a 402 run once read green) and the budget. Report-only: the model runs.
# Each one publishes a report and its delta against evals/baselines/<tier>-<name>.json as a job
# artifact; a failed case is a warning, not a red check, because model noise is not a broken PR.
# Fork PRs get no secrets, so they run the quality job only.
# Budget: the run fails when the OpenRouter key spent more than EVAL_BUDGET_USD (eval-budget.mjs);
# a hard cap is a credit limit on the CI key itself.
#
# Manual run (Actions → evals → Run workflow): pick the tier, optionally one skill or agent, and the
# task and judge models. Models default to ../decisions/2026-10-09-eval-tool-tiers-on-haiku-5-5.md.
# Needs the OPENROUTER_API_KEY repository secret.
name: evals

on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '*/CLAUDE.md'
      - '*/AGENTS.md'
      - 'TESTING.md'
      - '.claude/CLAUDE.md'
      - '.claude/rules/**'
      - '.claude/skills/**'
      - '.claude/agents/**'
      - 'evals/**'
      - '.github/workflows/evals.yml'
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '*/CLAUDE.md'
      - '*/AGENTS.md'
      - 'TESTING.md'
      - '.claude/CLAUDE.md'
      - '.claude/rules/**'
      - '.claude/skills/**'
      - '.claude/agents/**'
      - 'evals/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier to run
        type: choice
        options: [all, skills, agents, workflow]
        default: all
      name:
        description: One skill or agent name (empty = every one with evals; ignored for workflow)
        type: string
        default: ''
      model:
        description: Task model (OpenRouter slug)
        type: string
        default: anthropic/claude-haiku-5.5
      judge_model:
        description: Judge model (OpenRouter slug)
        type: string
        default: anthropic/claude-haiku-5.5
      budget_usd:
        description: Fail the run when it spends more than this on OpenRouter (USD)
        type: string
        default: '1.00'

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  EVAL_MODEL: ${{ inputs.model || 'anthropic/claude-haiku-5.5' }}
  EVAL_JUDGE_MODEL: ${{ inputs.judge_model || 'anthropic/claude-haiku-5.5' }}
  EVAL_BUDGET_USD: ${{ inputs.budget_usd || '1.00' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm eval:quality
      - run: pnpm exec vitest run scripts/ src/

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      agents: ${{ steps.detect.outputs.agents }}
      run_workflow: ${{ steps.detect.outputs.run_workflow }}
      models: ${{ steps.models.outputs.run }}
      usage_before: ${{ steps.usage.outputs.usd }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        working-directory: evals
        env:
          DISPATCH_TIER: ${{ inputs.tier }}
          DISPATCH_NAME: ${{ inputs.name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$DISPATCH_TIER" ]; then
            BASE="${PR_BASE:-$PUSH_BEFORE}"
            # A new branch pushes with before=000…0; fall back to the root commit (everything changed).
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
            fi
            CHANGED_FILES="$(git diff --name-only "$BASE...HEAD")"
            export CHANGED_FILES
          fi
          node scripts/ci-detect.mjs
      # Model jobs need the secret, which a fork PR does not get.
      - id: models
        env:
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FORK" = "true" ]; then
            echo "::warning title=Fork PR::no secrets on a fork PR, so only the quality job runs"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - id: usage
        if: steps.models.outputs.run == 'true'
        working-directory: evals
        run: echo "usd=$(node scripts/eval-budget.mjs usage)" >> "$GITHUB_OUTPUT"

  skills:
    needs: [quality, changes]
    if: needs.changes.outputs.models == 'true' && needs.changes.outputs.skills != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        skill: ${{ fromJSON(needs.changes.outputs.skills) }}
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # An explicit path: a bare name is an OR filter and would also run other skills' cases.
      - continue-on-error: true
        shell: bash
        run: pnpm exec vitest run "skills/${{ matrix.skill }}/" 2>&1 | tee eval.log
      - name: Report and compare with baseline
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          pnpm eval:report --label ci || exit 0
          B="baselines/skills-${{ matrix.skill }}.json"
          if [ -f "$B" ]; then
            cp "$B" results/repeat-baseline.json
            pnpm eval:delta baseline ci 2>&1 | tee delta.txt
          else
            echo "::warning title=No baseline::$B is missing, so this run has no comparison (evals/README.md: recalibrate)"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-skills-${{ matrix.skill }}
          path: |
            evals/eval.log
            evals/delta.txt
            evals/results/repeat-ci.json
            evals/results/outputs/
          if-no-files-found: ignore
          retention-days: 14
      - run: pnpm eval:provider-check eval.log

  agents:
    needs: [quality, changes]
    if: needs.changes.outputs.models == 'true' && needs.changes.outputs.agents != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        agent: ${{ fromJSON(needs.changes.outputs.agents) }}
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npm ci
        working-directory: reviewer-core
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - continue-on-error: true
        shell: bash
        run: pnpm exec vitest run "agents/${{ matrix.agent }}/" --no-file-parallelism 2>&1 | tee eval.log
      - name: Report and compare with baseline
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          pnpm eval:report --label ci || exit 0
          B="baselines/agents-${{ matrix.agent }}.json"
          if [ -f "$B" ]; then
            cp "$B" results/repeat-baseline.json
            pnpm eval:delta baseline ci 2>&1 | tee delta.txt
          else
            echo "::warning title=No baseline::$B is missing, so this run has no comparison (evals/README.md: recalibrate)"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-agents-${{ matrix.agent }}
          path: |
            evals/eval.log
            evals/delta.txt
            evals/results/repeat-ci.json
            evals/results/outputs/
          if-no-files-found: ignore
          retention-days: 14
      - run: pnpm eval:provider-check eval.log
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down

  workflow:
    needs: [quality, changes]
    if: needs.changes.outputs.models == 'true' && needs.changes.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - continue-on-error: true
        shell: bash
        run: pnpm exec vitest run workflow --no-file-parallelism 2>&1 | tee eval.log
      - name: Report and compare with baseline
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          pnpm eval:report --label ci || exit 0
          B="baselines/workflow.json"
          if [ -f "$B" ]; then
            cp "$B" results/repeat-baseline.json
            pnpm eval:delta baseline ci 2>&1 | tee delta.txt
          else
            echo "::warning title=No baseline::$B is missing, so this run has no comparison (evals/README.md: recalibrate)"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-workflow
          path: |
            evals/eval.log
            evals/delta.txt
            evals/results/repeat-ci.json
            evals/results/outputs/
          if-no-files-found: ignore
          retention-days: 14
      - run: pnpm eval:provider-check eval.log
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down

  budget:
    needs: [changes, skills, agents, workflow]
    if: always() && needs.changes.outputs.usage_before != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - working-directory: evals
        run: node scripts/eval-budget.mjs check "${{ needs.changes.outputs.usage_before }}" "$EVAL_BUDGET_USD"
