# Skill evals — runs the content-tier evals of every skill this change touches.
#
# .claude/skills/<name>/** or evals/skills/<name>/** → evals/skills/<name> (scripts/ci-detect.mjs).
# A changed skill without evals is printed as SKIP, not a failure. eval:quality (static, no LLM)
# runs first on every trigger and blocks; the eval cases only report. The content tier calls OpenRouter directly, no proxy.
# Needs the OPENROUTER_API_KEY repository secret.
name: eval-skills

on:
  push:
    paths:
      - '.claude/skills/**'
      - 'evals/skills/**'
      - '.github/workflows/eval-skills.yml'
  # Manual run: no diff, so ci-detect treats every artifact as changed and runs all suites.
  workflow_dispatch:
  pull_request:
    paths:
      - '.claude/skills/**'
      - 'evals/skills/**'
      - '.github/workflows/eval-skills.yml'

permissions:
  contents: read

concurrency:
  group: eval-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm eval:quality

  changes:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      agents: ${{ steps.detect.outputs.agents }}
      run_workflow: ${{ steps.detect.outputs.run_workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        working-directory: evals
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          BASE="${PR_BASE:-$PUSH_BEFORE}"
          # A new branch pushes with before=000…0; fall back to the root commit (everything changed).
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          CHANGED_FILES="$(git diff --name-only "$BASE...HEAD")"
          export CHANGED_FILES
          node scripts/ci-detect.mjs

  skills:
    needs: [quality, changes]
    if: needs.changes.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.changes.outputs.skills) }}
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_BACKEND: openrouter
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: anthropic/claude-haiku-5.5
      EVAL_JUDGE_MODEL: anthropic/claude-haiku-5.5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # An explicit path: a bare name is an OR filter and would also run other skills' cases.
      # Report-only: a failed case shows in the log and as a warning, not as a red check. Model
      # noise (DeepSeek/Haiku variance, a provider timeout) is not a broken PR. Setup, the proxy
      # and eval:quality still fail the job.
      - continue-on-error: true
        run: pnpm exec vitest run "skills/${{ matrix.skill }}/"
